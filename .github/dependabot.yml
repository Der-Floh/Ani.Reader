version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: Microsoft.Extensions.DependencyInjection
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
    groups:
      microsoft:
        patterns:
          - Microsoft.*
