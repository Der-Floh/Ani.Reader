name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Der-Floh/Der-Floh/.github/workflows/library-ci.yml@v1
    with:
      project-path: Ani.Reader/Ani.Reader.csproj
      package-id: Ani.Reader
      test-project: Ani.Reader.Test/Ani.Reader.Test.csproj
