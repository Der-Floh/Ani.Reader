name: Publish NuGet Package

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "value=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Ani.Reader/Ani.Reader.csproj -clp:ForceConsoleColor

      - name: Build
        run: >
          dotnet build Ani.Reader/Ani.Reader.csproj
          -c Release
          --no-restore
          -p:GeneratePackageOnBuild=false
          -p:Version=${{ steps.version.outputs.value }}
          -clp:ForceConsoleColor

      - name: Pack
        run: >
          dotnet pack Ani.Reader/Ani.Reader.csproj
          -c Release
          --no-build
          -o ./artifacts
          -p:Version=${{ steps.version.outputs.value }}
          -clp:ForceConsoleColor

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          fail_on_unmatched_files: true

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: Der-Floh

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      - name: Publish symbols to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.snupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
