name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Ani.Reader/Ani.Reader.csproj -clp:ForceConsoleColor

      - name: Build
        run: >
          dotnet build Ani.Reader/Ani.Reader.csproj
          -c Release
          --no-restore
          -p:GeneratePackageOnBuild=false
          -clp:ForceConsoleColor

      - name: Pack
        run: >
          dotnet pack Ani.Reader/Ani.Reader.csproj
          -c Release
          --no-build
          -o ./artifacts
          -clp:ForceConsoleColor
